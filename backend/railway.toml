[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# The caches are in-process, so two replicas simply have two independent caches — no
# shared state, no coordination, nothing to go stale. Scale horizontally freely.
numReplicas = 1
